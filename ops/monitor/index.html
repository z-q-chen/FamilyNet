<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>洛杉矶 VPS 监控 · FamilyNet</title>
<style>
:root{
  --fg:#f2f6ff;--muted:#9eafc8;--faint:#7289a9;--line:rgba(226,237,255,.13);
  --glass:rgba(10,14,22,.82);--inset:rgba(255,255,255,.045);
  --green:#46d5a1;--blue:#82b7ff;--yellow:#fbd16e;--red:#ff8396;
  --shadow:0 8px 30px rgba(0,0,0,.48);
}
*{box-sizing:border-box}html{min-height:100%;background:#0c1120}
body{margin:0;min-height:100vh;color:var(--fg);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:radial-gradient(ellipse 58% 40% at 9% 12%,rgba(39,84,120,.24),transparent 72%),radial-gradient(ellipse 50% 50% at 90% 4%,rgba(73,49,106,.20),transparent 75%),linear-gradient(150deg,#141d30,#0c1120 55%,#111927);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
a{color:var(--blue)}.glass{background:var(--glass);border:1px solid rgba(255,255,255,.18);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px) saturate(145%);-webkit-backdrop-filter:blur(14px) saturate(145%)}
.shell{width:min(1180px,calc(100% - 32px));margin:0 auto 55px}
header{position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(10,14,22,.76);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
.head{max-width:1180px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;color:#aad1ff;background:linear-gradient(135deg,rgba(99,165,255,.19),rgba(104,78,181,.17));border:1px solid rgba(140,179,255,.20)}
.logo svg{width:21px;height:21px}.brand h1{font-size:15px;line-height:1.15;font-weight:670;letter-spacing:.1px;margin:0}.brand small{display:block;font-size:11px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.nav{display:flex;align-items:center;gap:6px;padding:4px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04)}
.nav button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:12px;color:#b8c7dc;white-space:nowrap}
.nav button.active{background:rgba(146,181,235,.18);color:#f4f7ff;box-shadow:0 1px 6px rgba(0,0,0,.20)}
.top{margin:23px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:9px}
.h2{font-size:16px;font-weight:680;margin:0}.subtitle{font-size:11px;color:var(--faint)}.live{display:inline-flex;align-items:center;gap:7px;color:#b4c5d9;font-size:12px}.dot{background:var(--green);width:7px;height:7px;border-radius:50%;box-shadow:0 0 10px rgba(66,207,156,.38)}.dot.off{background:var(--red)}
.maincard{padding:21px 22px 19px}.cardtitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.cardtitle h2{font-size:19px;margin:0;font-weight:690;letter-spacing:.2px}.cardtitle .cap{font-size:11px;color:var(--muted)}.status{font-size:11px;border-radius:999px;padding:4px 10px;background:rgba(49,186,128,.11);border:1px solid rgba(72,219,151,.22);color:var(--green)}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{background:var(--inset);border:1px solid rgba(255,255,255,.045);border-radius:12px;padding:12px}.metricline{display:flex;justify-content:space-between;align-items:baseline;gap:5px;margin-bottom:10px}.label{font-size:11px;color:var(--muted)}.metric strong{font-size:16px;font-weight:680;font-variant-numeric:tabular-nums}.track{height:5px;border-radius:7px;overflow:hidden;background:rgba(149,177,216,.17)}.fill{height:100%;width:0;background:linear-gradient(90deg,#67a4f1,#5bdec2);border-radius:7px;transition:width .35s ease}
.net-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.netbox{border:1px solid rgba(255,255,255,.06);background:var(--inset);padding:12px 15px;border-radius:12px}.netbox .nettitle{display:flex;gap:7px;align-items:center;color:#b8c9df;font-size:12px}.netbox .netvalue{font-size:24px;line-height:1.15;font-weight:680;font-variant-numeric:tabular-nums;margin:7px 0 8px;white-space:nowrap}.netbox .nettotal{font-size:11px;color:var(--muted)}.netbox.up .nettitle svg{color:var(--green)}.netbox.down .nettitle svg{color:var(--blue)}
.quota{margin-top:14px;border:1px solid rgba(255,255,255,.06);background:var(--inset);border-radius:12px;padding:12px 15px}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}.quota .track{margin:10px 0 12px;height:7px}.quotafoot{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.value{font-weight:670;font-variant-numeric:tabular-nums;font-size:13px}.footline{font-size:11px;color:var(--muted);display:block}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 2px 12px}.sectiontitle h2{font-size:15px;margin:0;font-weight:670}.pinggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.pingcard{padding:13px 14px 14px;border-radius:14px}.pingtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.pingname{font-size:12px;font-weight:680}.pingtarget{font-size:10px;color:var(--faint);max-width:100%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.pingvalue{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.pingvalue small{font-size:11px;color:var(--muted);font-weight:500}.pingline{display:flex;align-items:center;justify-content:space-between;gap:6px}.spark{height:37px;display:flex;gap:2px;align-items:flex-end;background:rgba(255,255,255,.025);border-radius:6px;padding:5px 4px;margin-top:10px;overflow:hidden}.spark i{min-width:2px;flex:1;background:#30c38d;border-radius:2px 2px 0 0;opacity:.85;height:4px}.spark i.warn{background:#f1c55d}.spark i.bad{background:#f37a8b}.spark i.empty{background:rgba(255,255,255,.10)}.pingstamp{font-size:10px;color:var(--faint);margin-top:7px}
.auditbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.range{border:1px solid var(--line);background:rgba(255,255,255,.045);padding:5px 9px;border-radius:8px;color:#bfccdf;font-size:11px}.range.active{background:rgba(137,184,248,.16);border-color:rgba(137,184,248,.33);color:#f5f8ff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}.stat{padding:15px}.stat strong{display:block;font-size:21px;font-weight:680;margin-top:6px;font-variant-numeric:tabular-nums}
.auditcard{padding:16px 18px;margin-bottom:12px}.auditcard h3{font-size:14px;margin:0 0 12px;font-weight:670}.chartwrap{width:100%;overflow:hidden;background:rgba(255,255,255,.025);border-radius:11px;padding:8px}.chartwrap svg{width:100%;height:auto;min-height:135px;display:block}
.legend{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:14px;margin-top:9px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{height:7px;width:13px;border-radius:4px;display:inline-block}.muted{color:var(--muted)}.empty{color:var(--faint);font-size:12px;padding:10px 0}
table{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}th{text-align:left;font-size:11px;font-weight:500;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}td{padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.055);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}td.num,th.num{text-align:right}.table-scroll{overflow:auto}footer{margin:25px 0;color:#697e99;font-size:11px;text-align:center}
[hidden]{display:none!important}.skeleton{opacity:.5}
@media(max-width:860px){.pinggrid{grid-template-columns:repeat(2,minmax(0,1fr))}.maincard{padding:17px}.shell{width:min(100% - 24px,1180px)}}
@media(max-width:530px){.pinggrid{grid-template-columns:1fr}.head{padding:12px}.head .brand h1{font-size:13px}.nav button{padding:7px 10px;font-size:11px}.cardtitle h2{font-size:17px}.netbox .netvalue{font-size:19px}.netbox{padding:10px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:15px}.quotafoot{grid-template-columns:repeat(2,1fr);gap:10px}.value{font-size:12px} .mini-grid{gap:6px}.metric{padding:9px}.metric strong{font-size:13px} .metricline{display:block}.label{display:block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h3"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/></svg></div>
      <div><h1>洛杉矶 VPS 监控</h1><small id="report">尚未获取状态</small></div>
    </div>
    <div class="nav" role="tablist" aria-label="页面">
      <button type="button" data-tab="home" class="active" aria-selected="true">VPS 监控</button>
      <button type="button" data-tab="audit" aria-selected="false">流量分析</button>
    </div>
  </div>
</header>
<div class="shell">
<section id="home">
  <div class="top"><h2 class="h2">服务器状态</h2><span class="live"><i class="dot" id="dot"></i><span id="activity">连接中</span></span></div>
  <div class="glass maincard">
    <div class="cardtitle">
      <div><h2 id="serverName">洛杉矶 VPS</h2><div class="cap">运行时长 <span id="uptime">—</span>　·　负载 <span id="load">—</span></div></div>
      <span class="status" id="serverStatus">监控中</span>
    </div>
    <div class="mini-grid">
      <div class="metric"><div class="metricline"><span class="label">CPU</span><strong id="cpu">—</strong></div><div class="track"><div class="fill" id="cpuBar"></div></div></div>
      <div class="metric"><div class="metricline"><span class="label">内存</span><strong id="mem">—</strong></div><div class="track"><div class="fill" id="memBar"></div></div></div>
      <div class="metric"><div class="metricline"><span class="label">磁盘</span><strong id="disk">—</strong></div><div class="track"><div class="fill" id="diskBar"></div></div></div>
    </div>
    <div class="net-grid">
      <div class="netbox up">
        <div class="nettitle"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 17 10-10M7 7h10v10"/></svg>实时上传</div>
        <div class="netvalue" id="netUp">—</div><div class="nettotal">累计上传 <span id="totalUp">—</span></div>
      </div>
      <div class="netbox down">
        <div class="nettitle"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7v10h10M17 7 7 17"/></svg>实时下载</div>
        <div class="netvalue" id="netDown">—</div><div class="nettotal">累计下载 <span id="totalDown">—</span></div>
      </div>
    </div>
    <div class="quota">
      <div class="flex"><span class="label">流量额度 <span id="quotaHint"></span></span><span class="value" id="quotaValue">— / 400.00 GB</span></div>
      <div class="track"><div class="fill" id="quotaBar"></div></div>
      <div class="quotafoot">
        <div><span class="footline">套餐价格</span><span class="value" id="price">$11.70 / 季度</span></div>
        <div><span class="footline">距离到期</span><span class="value" id="expire">未设置</span></div>
        <div><span class="footline">剩余价值</span><span class="value" id="valueLeft">—</span></div>
        <div><span class="footline">网卡</span><span class="value" id="interface">—</span></div>
      </div>
    </div>
  </div>
  <div class="sectiontitle"><h2>线路延迟</h2><span class="subtitle">12 组 TCP 443 · 每 30 分钟 · 最近 24 小时</span></div>
  <div class="pinggrid" id="pinggrid"><div class="empty">正在加载线路数据</div></div>
</section>
<section id="audit" hidden>
  <div class="top">
    <h2 class="h2">流量分析</h2>
    <div class="auditbar" id="auditbar">
      <button class="range" data-hours="1">1 小时</button>
      <button class="range active" data-hours="24">24 小时</button>
      <button class="range" data-hours="168">7 天</button>
      <button class="range" data-hours="720">30 天</button>
    </div>
  </div>
  <div class="stats">
    <div class="glass stat"><div class="label">上传</div><strong id="auditUp">—</strong></div>
    <div class="glass stat"><div class="label">下载</div><strong id="auditDown">—</strong></div>
    <div class="glass stat"><div class="label">合计</div><strong id="auditTotal">—</strong></div>
  </div>
  <div class="glass auditcard"><h3>流量趋势</h3><div class="chartwrap" id="trafficChart"><div class="empty">正在加载</div></div><div class="legend"><span><i style="background:var(--green)"></i>上传</span><span><i style="background:var(--blue)"></i>下载</span></div></div>
  <div class="glass auditcard">
    <div class="flex"><h3>连接流量排行</h3><span class="subtitle">内核连接采样 · 近似值</span></div>
    <div class="table-scroll"><table><thead><tr><th style="width:36%">来源</th><th style="width:36%">目标</th><th class="num">去向</th><th class="num">回向</th></tr></thead><tbody id="flowRows"><tr><td colspan="4" class="empty">正在加载连接</td></tr></tbody></table></div>
  </div>
</section>
<footer>FamilyNet Monitor</footer>
</div>
<script>
(function(){
"use strict";
var page="home",hours=24,stampPing=0,stampAudit=0,busy=false,loaded=false;
function el(id){return document.getElementById(id)}
function text(id,value){var e=el(id);if(e)e.textContent=value}
function fmt(n){if(n===null||n===undefined||!Number.isFinite(Number(n)))return "—";var v=Math.abs(Number(n)),a=["B","KB","MB","GB","TB"];var i=0;while(v>=1024&&i<a.length-1){v/=1024;i++}return (Number(n)<0?"-":"")+v.toFixed(2)+" "+a[i]}
function pct(part,total){return total?Math.max(0,Math.min(100,part/total*100)):0}
function bar(id,p){el(id).style.width=Math.max(0,Math.min(100,p)).toFixed(2)+"%"}
function time(ts){return ts?new Date(ts*1000).toLocaleString("zh-CN",{hour12:false}):"—"}
function days(sec){var n=Math.floor(sec||0);return Math.floor(n/86400)+" 天 "+Math.floor(n%86400/3600)+" 小时"}
function escape(s){return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,function(x){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]})}
async function api(url){var r=await fetch(url,{cache:"no-store",credentials:"same-origin"});if(!r.ok)throw new Error(String(r.status));return r.json()}
function setActive(status){el("dot").classList.toggle("off",!status);text("activity",status?"已连接":"连接异常")}
function renderState(s){
  text("serverName",s.title||s.hostname||"洛杉矶 VPS");text("report","最近采集 "+time(s.time));
  document.title=(s.title||"洛杉矶 VPS 监控")+" · FamilyNet";
  text("uptime",days(s.uptime));text("load",(s.load||[]).join(" / "));
  text("cpu",s.cpu===null?"—":s.cpu.toFixed(2)+"%");
  text("mem",pct(s.memory_used,s.memory_total).toFixed(2)+"%");
  text("disk",pct(s.disk_used,s.disk_total).toFixed(2)+"%");
  bar("cpuBar",s.cpu||0);bar("memBar",pct(s.memory_used,s.memory_total));bar("diskBar",pct(s.disk_used,s.disk_total));
  el("mem").title=fmt(s.memory_used)+" / "+fmt(s.memory_total);
  el("disk").title=fmt(s.disk_used)+" / "+fmt(s.disk_total);
  text("netUp",fmt(s.txps)+"/s");text("netDown",fmt(s.rxps)+"/s");
  text("totalUp",fmt(s.up_total));text("totalDown",fmt(s.down_total));
  text("quotaValue",fmt(s.used)+" / "+fmt(s.quota));bar("quotaBar",pct(s.used,s.quota));
  text("quotaHint",s.reset_day?"· 每月 "+s.reset_day+" 日重置":"· 自安装以来已记录");
  text("price","$"+Number(s.price_usd||0).toFixed(2)+" / "+(s.price_cycle_months===3?"季度":s.price_cycle_months+" 个月"));
  var exp=s.expires_at,dd=exp?Math.ceil((Date.parse(exp)-Date.now())/86400000):null;
  text("expire",dd===null||!Number.isFinite(dd)?"未设置":(dd>=0?dd+" 天":"已到期"));
  text("valueLeft",dd===null||!Number.isFinite(dd)?"—":"$"+Math.max(0,Number(s.price_usd||0)*Math.max(0,dd)/Math.max(30,Number(s.price_cycle_months||3)*30)).toFixed(2));
  text("interface",s.interface||"—");setActive(true);loaded=true
}
function level(lat,ok){return !ok?"bad":lat>250?"bad":lat>130?"warn":""}
function renderPings(data){
  var out="";
  data.forEach(function(t){
    var h=t.history||[],last=h.length?h[h.length-1]:null;
    var good=last&&last.ok,lat=good?Number(last.latency):null;
    var val=last?(good?lat.toFixed(2):"超时"):"—";
    var max=0;h.forEach(function(q){if(q.ok)max=Math.max(max,q.latency)});
    var bars=h.slice(-48).map(function(q){
      var height=q.ok?(max?Math.max(9,Math.min(100,q.latency/max*95)):12):9;
      return '<i class="'+level(q.latency,q.ok)+'" style="height:'+height+'%" title="'+escape(time(q.ts))+' · '+(q.ok?q.latency+" ms":"失败")+'"></i>';
    }).join("");
    if(!bars)bars='<i class="empty" style="height:8%"></i>';
    out+='<div class="glass pingcard"><div class="pingtop"><span class="pingname">'+escape(t.name)+'</span><span class="pingvalue" style="color:'+(good?"var(--green)":last?"var(--red)":"var(--muted)")+'">'+val+(good?'<small> ms</small>':"")+'</span></div><div class="pingtarget" title="'+escape(t.target)+'">'+escape(t.target)+'</div><div class="spark">'+bars+'</div><div class="pingstamp">最近测试 '+time(last&&last.ts)+'</div></div>';
  });
  el("pinggrid").innerHTML=out;
}
function renderChart(data){
  var w=900,h=200,pad=20,max=1;
  data.forEach(function(a){max=Math.max(max,a.up,a.down)});
  function points(key){return data.map(function(a,i){var x=pad+(w-pad*2)*i/Math.max(1,data.length-1),y=h-pad-(h-pad*2)*a[key]/max;return x.toFixed(2)+","+y.toFixed(2)}).join(" ")}
  var guide='<line x1="20" y1="60" x2="880" y2="60" stroke="rgba(255,255,255,.09)"/><line x1="20" y1="110" x2="880" y2="110" stroke="rgba(255,255,255,.09)"/><line x1="20" y1="160" x2="880" y2="160" stroke="rgba(255,255,255,.09)"/>';
  var svg='<svg viewBox="0 0 900 200" preserveAspectRatio="none" aria-label="网络流量曲线">'+guide;
  if(data.length>1){svg+='<polyline fill="none" stroke="#40d2a4" stroke-width="2.5" points="'+points("up")+'"/><polyline fill="none" stroke="#82b7ff" stroke-width="2.5" points="'+points("down")+'"/>'}
  svg+='</svg>';
  var note=data.length?"最大区间："+fmt(max)+" · "+time(data[0].ts)+" — "+time(data[data.length-1].ts):"该时段尚无流量记录";
  el("trafficChart").innerHTML=svg+'<div class="subtitle" style="padding:2px 8px 7px">'+escape(note)+'</div>'
}
function renderAudit(hist,fl){
  var up=0,down=0;
  hist.forEach(function(x){up+=x.up;down+=x.down});
  text("auditUp",fmt(up));text("auditDown",fmt(down));text("auditTotal",fmt(up+down));
  renderChart(hist);
  var out="";
  (fl.rows||[]).slice(0,100).forEach(function(x){
    var src=x.src+(x.sport?":"+x.sport:""),dst=x.dst+(x.dport?":"+x.dport:"");
    out+='<tr title="'+escape(time(x.start)+" — "+time(x.end)+" · "+x.protocol)+'"><td>'+escape(src)+'</td><td>'+escape(dst)+'</td><td class="num">'+fmt(x.up)+'</td><td class="num">'+fmt(x.down)+'</td></tr>';
  });
  if(!out)out='<tr><td colspan="4" class="empty">'+(fl.sampling==="unavailable"?"连接计数不可用":"暂无可用的连接计数")+'</td></tr>';
  el("flowRows").innerHTML=out;
}
async function refresh(){
  if(document.hidden||busy)return;
  busy=true;
  try{
    var s=await api("/api/state");renderState(s);
    if(page==="home"&&(Date.now()-stampPing>55000||!stampPing)){
      var p=await api("/api/pings");renderPings(p);stampPing=Date.now();
    }
    if(page==="audit"&&(Date.now()-stampAudit>15000||!stampAudit)){
      var all=await Promise.all([api("/api/history?hours="+hours),api("/api/flows?hours="+hours)]);
      renderAudit(all[0],all[1]);stampAudit=Date.now();
    }
  }catch(e){setActive(false);text("report",loaded?"连接中断 · "+time(Date.now()/1000):"无法连接监控服务")}
  finally{busy=false}
}
document.querySelectorAll("[data-tab]").forEach(function(b){b.addEventListener("click",function(){
  page=b.dataset.tab;

  refresh();
})});

  hours=Number(b.dataset.hours)||24;stampAudit=0;
  document.querySelectorAll("[data-hours]").forEach(function(x){x.classList.toggle("active",x===b)});
  refresh()
})});
